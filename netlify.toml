# Netlify config for lukeerickson.com — static site, no build step.
[build]
  publish = "."

# Sensible default security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
