# Netlify config for lukeerickson.com — static site, no build step.
[build]
  publish = "."

# Sensible default security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fonts never change -> cache hard for a year.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are stable -> cache a week (new derivatives use new filenames).
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/og/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# NOTE: CSS/JS intentionally fall through to Netlify's revalidating default
# (must-revalidate + ETag) so a deploy never serves stale styles/scripts.
